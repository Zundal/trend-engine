# 매시간 트렌드를 수집해 정적 대시보드를 GitHub Pages 에 배포한다.
# 키는 저장소 Settings → Secrets and variables → Actions 에 추가 (없으면 해당 기능만 비활성).
#
# 매시 실행의 주 경로는 사슬이다: 수집한 실행이 끝나면 next 잡이 next-run.yml 을 부르고, 그 워크플로가
# 'hourly' 환경의 대기 타이머(50분)가 지난 뒤 이 워크플로를 chain=true 로 다시 부른다.
# GitHub 예약(cron)은 부하가 크면 대부분 버려져서(2026-10-17: 시간당 4칸 중 약 7%만 생성) 끊긴 사슬을 다시 잇는 용도다.
name: Deploy dashboard

on:
  # 실제 수집 간격은 gate 잡이 45분 이상으로 묶는다 — 업스트림 호출은 매시 수준 그대로.
  schedule:
    - cron: "7,22,37,52 * * * *"  # UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_problem:
        description: "경고 알림 테스트 (가짜 문제 1건 주입)"
        type: boolean
        default: false
      chain:
        description: "next-run.yml 이 부른 실행 (예약처럼 게이트를 거친다)"
        type: boolean
        default: false

permissions:
  contents: write  # 일별 기록을 data 브랜치에 커밋
  issues: write    # 수집 문제 발생 시 경고 이슈
  actions: write   # 오래된 스냅샷 캐시 정리
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 예약·사슬 실행만: 직전 수집(스냅샷 캐시 저장)이 45분 안이면 건너뛴다. push·수동 실행은 항상 수집.
  # 확인이 실패하면 수집한다 (게이트 때문에 사이트가 조용히 멈추면 안 됨).
  # 대기 타이머가 빠진 채 사슬이 바로 돌아와도 여기서 건너뛰고, 건너뛴 실행은 사슬을 잇지 않아 연속 수집이 되지 않는다.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CHAIN: ${{ inputs.chain && 'true' || '' }}
        run: |
          age=$(gh cache list -R "${{ github.repository }}" --key trend-db- --sort created_at --order desc --limit 1 --json createdAt \
                  -q '.[0].createdAt | sub("\\.[0-9]+"; "") | now - fromdateiso8601 | floor') || age=""
          if { [ "$EVENT" = "schedule" ] || [ "$CHAIN" = "true" ]; } && [ -n "$age" ] && [ "$age" -lt 2700 ]; then go=false; else go=true; fi
          echo "event=$EVENT chain=${CHAIN:-false} last_collect_age=${age:-unknown}s go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      health_count: ${{ steps.health.outputs.count }}
      health_body: ${{ steps.health.outputs.body }}  # 키 없는 네이버 웹 모드는 페이싱 때문에 3시간마다 ~6분 걸림
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_API: ${{ vars.NAVER_API }}  # 비우면 자동: 키 있으면 hub, 없으면 web(키 없는 데이터랩 웹). 구 키면 legacy
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TREND_ENGINE_DATA_KEY: ${{ secrets.TREND_ENGINE_DATA_KEY }}  # 공개 데이터 암호화 키 (64 hex)
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}  # (선택) 새 알림을 슬랙으로
      TREND_ENGINE_DB: data/trends.db
      TREND_ENGINE_ARCHIVE: archive
    steps:
      - uses: actions/checkout@v7
      # 영구 기록: 끝난 날(KST)의 요약이 쌓이는 data 브랜치
      - uses: actions/checkout@v7
        with:
          ref: data
          path: archive
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --all-extras --frozen

      # 스냅샷 DB 를 실행 간에 이어받아 NEW / ▲▼ 추이와 순위 그래프를 만든다.
      - name: Restore snapshot DB
        uses: actions/cache/restore@v6
        with:
          path: data
          key: trend-db-${{ github.run_id }}
          restore-keys: trend-db-

      - name: Collect & export static site
        run: uv run trend-engine export --out site --regions KR,US,JP,GB,TW,VN --health health.json

      # 문제가 있어도 여기서 멈추지 않는다 (사이트는 성공한 데이터로 배포) — 판정은 alert 잡이 한다
      - name: Health check
        id: health
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_SIMULATE: ${{ inputs.simulate_problem && '1' || '' }}
        run: uv run trend-engine health-check health.json || true

      - name: Commit finished days to data branch
        working-directory: archive
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no new days"; exit 0; fi
          git -c user.name="trend-engine-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "archive $(git diff --cached --name-only | cut -d/ -f1 | sort -u | tr '\n' ' ')"
          git push -q origin HEAD:data

      - name: Save snapshot DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: trend-db-${{ github.run_id }}

      # 매 실행마다 새 캐시가 생기므로 최신 3개만 남긴다 (이어받기에는 최신 1개면 충분)
      - name: Prune old snapshot caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --key trend-db- --sort created_at --order desc --limit 100 --json id -q '.[3:][].id' \
            | xargs -r -n1 gh cache delete -R "${{ github.repository }}" || true

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 조용한 실패 방지: 문제가 있으면 실행을 빨간불로 + 경고 이슈 1개를 열고(이후엔 내용만 갱신), 복구되면 자동으로 닫는다.
  alert:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.go != 'false'  # 게이트가 건너뛴 실행은 판정하지 않는다 (게이트 자체가 죽으면 판정)
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the warning issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COUNT: ${{ needs.build.outputs.health_count }}
          BODY: ${{ needs.build.outputs.health_body }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠ 트렌드 수집 경고"
          num=$(gh issue list -R "$REPO" --state open --search "in:title $title" --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ "$BUILD" != "success" ] || [ "$DEPLOY" != "success" ]; then
            COUNT=1
            BODY="배포 파이프라인 실패 (build=$BUILD, deploy=$DEPLOY) — 사이트가 갱신되지 않았을 수 있습니다.

          실행 로그: $RUN_URL"
          fi
          if [ "${COUNT:-0}" -gt 0 ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" -R "$REPO" --body "$BODY"
            else
              gh issue create -R "$REPO" --title "$title" --body "$BODY"
            fi
            echo "::error::$COUNT problem(s) — see issue '$title'"
            exit 1
          elif [ -n "$num" ]; then
            gh issue close "$num" -R "$REPO" --comment "정상으로 복구됐습니다. ($RUN_URL)"
          fi

  # 다음 수집 예약: 수집을 시도한 실행만 사슬을 잇는다 (게이트가 건너뛴 실행은 잇지 않음).
  # 빌드·배포가 실패해도 잇는다 — 50분 뒤 다시 시도해야 하니까. 게이트 자체가 죽어도 잇는다.
  next:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.go != 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run next-run.yml -R "${{ github.repository }}"

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Engine</title>
<meta name="description" content="지금 사람들의 관심사 — 나라별 트렌드와 연령·성별 관심">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6860; --line: #e4e1da;
  --accent: #d9480f; --accent-soft: #fff0e6; --up: #c92a2a; --down: #1c7ed6; --new: #d9480f;
  --hot: 217, 72, 15; --cold: 28, 126, 214;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #1c1c1a; --ink: #eceae4; --muted: #9a978f; --line: #2e2d2a;
    --accent: #ff8a4c; --accent-soft: #3a2518; --up: #ff6b6b; --down: #4dabf7; --new: #ff8a4c;
    --hot: 255, 138, 76; --cold: 77, 171, 247;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1320px; margin: 0 auto; padding: 12px 16px 0; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; letter-spacing: -.02em; }
h1 span { color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.spacer { flex: 1; }
.meta { color: var(--muted); font-size: 12px; }
.sub { max-width: 1320px; margin: 0 auto; padding: 12px 16px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sub[hidden] { display: none; }
.sub .hint { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 5px 13px; cursor: pointer; font: inherit; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: progress; }
.banner { max-width: 1320px; margin: 10px auto 0; padding: 8px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
main { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
main[hidden] { display: none; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
section.card h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
section.card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wide { grid-column: 1 / -1; }
ol.rank { list-style: none; margin: 0; padding: 0; }
ol.rank li { display: grid; grid-template-columns: 28px minmax(0, 1fr) 54px 110px; gap: 8px; align-items: center;
  padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
ol.rank li:hover, ol.rank li.sel { background: var(--accent-soft); }
.n { font-family: var(--mono); color: var(--muted); text-align: right; }
.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.st { font-size: 11px; font-family: var(--mono); text-align: center; }
.st.new { color: var(--new); font-weight: 700; } .st.rising { color: var(--up); } .st.falling { color: var(--down); } .st.steady { color: var(--muted); }
.score { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.score i { display: block; height: 100%; background: var(--accent); }
.detail { margin-top: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; }
.detail h3 { margin: 0 0 6px; font-size: 15px; }
.detail ul { margin: 4px 0 8px; padding-left: 18px; }
.muted { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 7px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.list li a { color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.list li a:hover { text-decoration: underline; }
.tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
svg.spark { width: 100%; height: 40px; }
/* 연령별 */
.bars { list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(80px, 38%) 58px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bars .bar-bg { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bars .bar-bg i { display: block; height: 100%; background: var(--accent); }
.bars .x { font-family: var(--mono); font-size: 12px; text-align: right; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 18px; }
.shopgrid h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.shopgrid ol { margin: 0; padding-left: 18px; font-size: 13px; }
.shopgrid li.dist { color: var(--accent); font-weight: 600; }
table.heat { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 12px; table-layout: fixed; }
table.heat th { font-weight: 500; color: var(--muted); font-size: 11px; padding: 2px; }
table.heat th.kw { text-align: left; width: 30%; }
table.heat td { text-align: center; padding: 5px 0; border-radius: 4px; font-family: var(--mono); font-size: 11px; }
table.heat td.kw { text-align: left; font-family: inherit; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
table.heat th.on { color: var(--accent); font-weight: 700; }
.legend { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 22px; height: 10px; border-radius: 3px; vertical-align: middle; }
.kwrow { display: flex; gap: 6px; margin-bottom: 10px; }
.kwrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; }
@media (max-width: 520px) {
  main { padding: 12px; }
  ol.rank li { grid-template-columns: 22px minmax(0, 1fr) 40px 36px; gap: 6px; }
  .bars li { grid-template-columns: 20px minmax(0, 1fr) 70px 50px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Trend <span>Engine</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-country" aria-selected="true" data-view="country">나라별</button>
      <button class="tab" role="tab" id="tab-age" aria-selected="false" data-view="age">연령별</button>
    </nav>
    <div class="spacer"></div>
    <span class="meta" id="gen"></span>
    <button class="ghost" id="refresh" hidden>새로 수집</button>
  </div>
  <div class="sub" id="sub-country">
    <div class="chips" id="regions" role="group" aria-label="나라"></div>
  </div>
  <div class="sub" id="sub-age" hidden>
    <div class="chips" id="groups" role="group" aria-label="연령·성별 그룹"></div>
    <span class="hint">한국 · 최근 7일</span>
  </div>
</header>
<div id="banner"></div>

<!-- 나라별 -->
<main id="view-country">
  <div class="col">
    <section class="card">
      <h2>지금 관심 랭킹 <small>행을 누르면 상세</small></h2>
      <ol class="rank" id="rank"></ol>
      <button class="ghost" id="more" style="margin-top:8px" hidden></button>
      <div id="detail"></div>
    </section>
  </div>
  <div class="col">
    <section class="card">
      <h2>인기 동영상</h2>
      <ul class="list" id="yt"></ul>
    </section>
    <section class="card">
      <h2>뉴스 헤드라인</h2>
      <ul class="list" id="news"></ul>
    </section>
  </div>
</main>

<!-- 연령별 -->
<main id="view-age" hidden>
  <div class="col">
    <section class="card" id="card-issues">
      <h2><span id="g-title">20대가 특히 관심 있는 이슈</span> <small>전체 평균 대비 몇 배 더 검색하는지</small></h2>
      <ol class="bars" id="issues"></ol>
    </section>
  </div>
  <div class="col" id="shopcol">
    <section class="card">
      <h2><span id="g-title2">20대 쇼핑 관심</span> <small><b style="color:var(--accent)">주황</b> = 전체 순위엔 없는 이 그룹만의 관심</small></h2>
      <div id="shop"><div class="empty">불러오는 중…</div></div>
    </section>
  </div>
  <section class="card wide">
    <h2>그룹 비교표 <small>오늘의 이슈 × 연령·성별 (100 = 평균)</small></h2>
    <div class="kwrow" id="kwrow">
      <input id="kwinput" placeholder="직접 비교할 키워드 (쉼표 구분)" aria-label="키워드">
      <button class="ghost" id="kwgo">비교</button>
      <button class="ghost" id="kwreset">오늘 이슈로</button>
    </div>
    <div id="heat"><div class="empty">불러오는 중…</div></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const GROUPS = ["10대", "20대", "30대", "40대", "50대", "60대+", "남성", "여성", "20대 여성", "20대 남성"];
const HIDDEN_REGIONS = new Set(["KR-11", "KR-26"]); // 서울·부산은 나라 탭에서 제외
let META = null, REPORT = null, SEG = null, SHOP = null;
let view = "country", region = "KR", group = "20대", selected = null, showAll = false;

// Static mode (published site): data is pre-built into encrypted api/*.dat files by `trend-engine export`.
let STATIC = false; // export.py rewrites this to true
const DATA_KEY = ""; // export.py injects the AES-256-GCM key (hex)
const HISTORY = {};
let CRYPTO_KEY = null;
async function decrypt(b64) {
  if (!crypto.subtle) throw new Error("보안 연결(https)로 접속해 주세요");
  CRYPTO_KEY ??= await crypto.subtle.importKey("raw", Uint8Array.from(DATA_KEY.match(/../g), (h) => parseInt(h, 16)), "AES-GCM", false, ["decrypt"]);
  const raw = Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, CRYPTO_KEY, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function staticGet(name) {
  const r = await fetch(`api/${name}.dat`, { cache: "no-cache" });
  if (!r.ok) throw new Error("데이터가 아직 없습니다");
  return decrypt(await r.text());
}
async function api(path, opts) {
  if (STATIC) {
    const u = new URL(path, location.href);
    const name = u.pathname.split("/").pop();
    const r = u.searchParams.get("region") || region;
    if (name === "keyword") throw new Error("이 페이지에서는 직접 비교를 지원하지 않습니다");
    if (name === "history") { HISTORY[r] ??= await staticGet(`history-${r}`); return HISTORY[r][u.searchParams.get("key")] || []; }
    return staticGet(["meta", "shopping"].includes(name) ? name : `${name}-${r}`);
  }
  const r = await fetch(path, { cache: "no-cache", ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || (STATIC && r.status === 404 ? "데이터가 아직 없습니다" : r.statusText));
  if (body && body.error) throw new Error("데이터를 불러오지 못했습니다");
  return body;
}

// ---- routing: #country/KR, #age/20대 -------------------------------------------------
function readHash() {
  const [v, arg] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (v === "age") { view = "age"; if (GROUPS.includes(arg)) group = arg; }
  else if (v === "country") { view = "country"; if (arg) region = arg; }
}
function writeHash() {
  const h = view === "age" ? `#age/${group}` : `#country/${region}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}
function setView(v) {
  view = v; writeHash();
  for (const t of $$(".tab")) t.setAttribute("aria-selected", String(t.dataset.view === v));
  $("#view-country").hidden = $("#sub-country").hidden = v !== "country";
  $("#view-age").hidden = $("#sub-age").hidden = v !== "age";
  if (v === "country") loadCountry(); else loadAge();
}

// ---- 나라별 --------------------------------------------------------------------------
function countries() { return META.regions.filter((r) => !HIDDEN_REGIONS.has(r.code)); }
function renderRegions() {
  $("#regions").innerHTML = countries().map((r) =>
    `<button class="chip" aria-pressed="${r.code === region}" data-code="${r.code}">${esc(r.name)}</button>`).join("");
}
function statusCell(c) {
  if (!c.status) return `<span class="st"></span>`;
  const txt = { new: "NEW", rising: "▲" + (c.rank_change || ""), falling: "▼" + Math.abs(c.rank_change || 0), steady: "–" }[c.status];
  return `<span class="st ${c.status}">${txt}</span>`;
}
function renderRank() {
  const cs = REPORT.clusters.slice(0, showAll ? 50 : 20);
  const max = Math.max(...cs.map((c) => c.score), 1);
  $("#rank").innerHTML = cs.map((c, i) => `
    <li data-i="${i}" class="${selected === i ? "sel" : ""}">
      <span class="n">${i + 1}</span>
      <span class="label" title="${esc(c.label)}">${esc(c.label)}</span>
      ${statusCell(c)}
      <span class="score"><i style="width:${(c.score / max * 100).toFixed(1)}%"></i></span>
    </li>`).join("") || `<li class="empty">데이터가 없습니다</li>`;
  $("#more").hidden = REPORT.clusters.length <= 20;
  $("#more").textContent = showAll ? "접기" : `더보기 (${REPORT.clusters.length}개)`;
}
async function renderDetail(c) {
  const mentions = c.mentions || [];
  $("#detail").innerHTML = `<div class="detail">
    <h3>${esc(c.label)}</h3>
    ${c.volume ? `<div class="muted">검색량 ${c.volume.toLocaleString()}+</div>` : ""}
    ${c.related.length ? `<b>관련 뉴스</b><ul>${c.related.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    ${mentions.length ? `<b>관련 콘텐츠</b><ul>${mentions.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    <b>순위 추이</b><div id="spark" class="muted">…</div></div>`;
  try {
    const h = await api(`api/history?region=${region}&key=${encodeURIComponent(c.key)}`);
    $("#spark").innerHTML = h.length < 2 ? "기록이 쌓이면 표시됩니다" : spark(h.map((x) => x.rank));
  } catch (e) { $("#spark").textContent = e.message; }
}
function spark(ranks) {
  const w = 300, hgt = 40, maxR = Math.max(...ranks, 10);
  const pts = ranks.map((r, i) => `${(i / (ranks.length - 1) * w).toFixed(1)},${((r - 1) / (maxR - 1 || 1) * (hgt - 6) + 3).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none" role="img" aria-label="순위 추이 (위쪽이 상위)">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="muted" style="font-size:11px">최근 ${ranks.length}회 · 현재 ${ranks.at(-1)}위 (위쪽이 상위)</div>`;
}
function renderContent() {
  // Link targets stay in memory (opened on click) so addresses don't show on hover.
  $("#yt").innerHTML = (REPORT.videos || []).slice(0, 12).map((v, i) => `<li><a href="#" data-v="${i}">${esc(v.title)}</a>
    <span class="tag">${esc(v.category || "")} ${v.views ? fmtViews(v.views) : ""}</span></li>`).join("") || `<li class="empty">데이터가 없습니다</li>`;
  $("#news").innerHTML = (REPORT.news || []).slice(0, 12).map((n, i) => `<li><a href="#" data-n="${i}">${esc(n.title)}</a></li>`).join("")
    || `<li class="empty">데이터가 없습니다</li>`;
}
function fmtViews(v) { return v >= 1e8 ? (v / 1e8).toFixed(1) + "억회" : v >= 1e4 ? Math.round(v / 1e4) + "만회" : Math.round(v).toLocaleString() + "회"; }
async function loadCountry(refresh = false) {
  selected = null; $("#detail").innerHTML = "";
  $("#rank").innerHTML = `<li class="empty">불러오는 중…</li>`;
  try {
    REPORT = await api(`api/report?region=${region}${refresh ? "&refresh=true" : ""}`);
    $("#gen").textContent = `${new Date(REPORT.generated_at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })} 기준 · 매시간 갱신`;
    renderRank(); renderContent();
  } catch (e) { $("#rank").innerHTML = `<li class="empty">${esc(e.message)}</li>`; }
}

// ---- 연령별 --------------------------------------------------------------------------
function renderGroups() {
  $("#groups").innerHTML = GROUPS.map((g) => `<button class="chip" aria-pressed="${g === group}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  $("#g-title").textContent = `${group}${josa(group)} 특히 관심 있는 이슈`;
  $("#g-title2").textContent = `${group} 쇼핑 관심`;
}
function josa(word) {  // 이/가: '여성이', '20대가'
  const c = word.replace(/[^가-힣]/g, "").slice(-1);
  return c && (c.charCodeAt(0) - 0xac00) % 28 ? "이" : "가";
}
function renderIssues() {
  const card = $("#card-issues");
  if (!SEG) { $("#issues").innerHTML = `<li class="empty">불러오는 중…</li>`; return; }
  const rows = SEG.top_by_segment?.[group];
  card.hidden = !rows;  // 조합 그룹(20대 여성 등)은 쇼핑만 제공 → 쇼핑 카드를 넓게
  card.parentElement.hidden = !rows;
  $("#shopcol").classList.toggle("wide", !rows);
  if (!rows) return;
  const labels = SEG.labels || {};
  const top = rows.filter((r) => r.affinity > 100).slice(0, 10);
  const list = top.length ? top : rows.slice(0, 5);
  const max = Math.max(...list.map((r) => r.affinity), 100);
  $("#issues").innerHTML = list.map((r, i) => `<li>
      <span class="n">${i + 1}</span>
      <span class="label" title="${esc(labels[r.keyword] || r.keyword)}">${esc(labels[r.keyword] || r.keyword)}</span>
      <span class="bar-bg"><i style="width:${(r.affinity / max * 100).toFixed(1)}%"></i></span>
      <span class="x">${(r.affinity / 100).toFixed(1)}배</span></li>`).join("")
    || `<li class="empty">오늘 이슈 중 이 그룹이 두드러진 키워드가 없습니다</li>`;
}
function renderShopping() {
  if (!SHOP) return;
  const cats = SHOP.by_segment[group];
  if (!cats) { $("#shop").innerHTML = `<div class="empty">이 그룹의 쇼핑 데이터가 없습니다</div>`; return; }
  $("#shop").innerHTML = `<div class="shopgrid">${Object.entries(cats).map(([cat, v]) => {
    const dist = new Set(v.distinctive);
    return `<div><h4>${esc(cat)}</h4><ol>${v.top.slice(0, 6).map((k) => `<li class="${dist.has(k) ? "dist" : ""}">${esc(k)}</li>`).join("")}</ol></div>`;
  }).join("")}</div>`;
}
function heatColor(v) {
  if (v == null) return "transparent";
  const d = Math.max(-1, Math.min(1, Math.log2(v / 100) / 1.5));
  return `rgba(${getComputedStyle(document.documentElement).getPropertyValue(d >= 0 ? "--hot" : "--cold")}, ${(Math.abs(d) * 0.75 + 0.05).toFixed(2)})`;
}
function renderHeat(s) {
  const labels = s.labels || {};
  const rows = s.keywords.filter((k) => Object.values(s.affinity[k]).some((v) => v != null));
  const warn = s.synthetic ? `<div class="banner" style="margin:0 0 8px">⚠ 샘플 데이터 — 실제 값이 아닙니다</div>` : "";
  if (!rows.length) { $("#heat").innerHTML = warn + `<div class="empty">비교할 수 있는 키워드가 없습니다</div>`; return; }
  $("#heat").innerHTML = warn + `<table class="heat"><thead><tr><th class="kw">키워드</th>${s.segments.map((g) => `<th class="${g === group ? "on" : ""}">${esc(g)}</th>`).join("")}</tr></thead><tbody>${
    rows.map((k) => `<tr><td class="kw" title="${esc(labels[k] || k)}">${esc(labels[k] || k)}</td>${s.segments.map((g) => {
      const v = s.affinity[k][g];
      return `<td style="background:${heatColor(v)}" title="${esc(g)}: ${v == null ? "데이터 없음" : (v / 100).toFixed(1) + "배"}">${v == null ? "·" : Math.round(v)}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>
    <div class="legend"><span><span class="sw" style="background:${heatColor(40)}"></span> 덜 관심</span>
    <span><span class="sw" style="background:${heatColor(100)}"></span> 평균(100)</span>
    <span><span class="sw" style="background:${heatColor(250)}"></span> 훨씬 관심</span>
    <span>기간 ${s.period[0]} ~ ${s.period[1]}</span></div>`;
}
async function loadAge(custom) {
  renderGroups();
  if (!SEG || custom !== undefined) {
    $("#heat").innerHTML = `<div class="empty">불러오는 중…</div>`;
    try {
      const s = custom ? await api(`api/keyword?q=${encodeURIComponent(custom)}`) : await api(`api/segments?region=KR&top=14`);
      if (!custom) SEG = s;
      renderHeat(s);
    } catch (e) { $("#heat").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  } else renderHeat(SEG);
  renderIssues();
  if (!SHOP) { try { SHOP = await api("api/shopping"); } catch (e) { $("#shop").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
  renderShopping();
  if (SHOP?.period) $("#gen").textContent = `${SHOP.period[0]} ~ ${SHOP.period[1]}`;
}

// ---- init ---------------------------------------------------------------------------
(async function init() {
  META = await api("api/meta");
  if (META.offline) $("#banner").innerHTML = `<div class="banner">오프라인 데모 모드 — 녹화된 샘플 데이터로 동작 중입니다.</div>`;
  if (STATIC) $("#kwrow").hidden = true;
  else { $("#refresh").hidden = false; $("#refresh").onclick = () => view === "country" ? loadCountry(true) : null; }
  try { region = localStorage.getItem("te.region") || region; group = localStorage.getItem("te.group") || group; } catch (_) {}
  readHash();
  if (!countries().some((r) => r.code === region)) region = countries()[0]?.code || "KR";
  renderRegions();

  $("#regions").onclick = (e) => {
    const b = e.target.closest("[data-code]"); if (!b) return;
    region = b.dataset.code; try { localStorage.setItem("te.region", region); } catch (_) {}
    renderRegions(); writeHash(); showAll = false; loadCountry();
  };
  $("#groups").onclick = (e) => {
    const b = e.target.closest("[data-g]"); if (!b) return;
    group = b.dataset.g; try { localStorage.setItem("te.group", group); } catch (_) {}
    writeHash(); loadAge();
  };
  $$(".tab").forEach((t) => t.onclick = () => setView(t.dataset.view));
  $("#rank").onclick = (e) => {
    const li = e.target.closest("[data-i]"); if (!li) return;
    selected = +li.dataset.i; renderRank(); renderDetail(REPORT.clusters[selected]);
  };
  $("#more").onclick = () => { showAll = !showAll; renderRank(); };
  const openItem = (list, attr) => (e) => {
    const a = e.target.closest(`[${attr}]`); if (!a) return;
    e.preventDefault();
    const url = (REPORT[list] || [])[+a.getAttribute(attr)]?.url;
    if (url) window.open(url, "_blank", "noopener");
  };
  $("#yt").onclick = openItem("videos", "data-v");
  $("#news").onclick = openItem("news", "data-n");
  $("#kwgo").onclick = () => { const v = $("#kwinput").value.trim(); if (v) loadAge(v); };
  $("#kwinput").onkeydown = (e) => { if (e.key === "Enter") $("#kwgo").click(); };
  $("#kwreset").onclick = () => { SEG = null; loadAge(); };
  window.onhashchange = () => { readHash(); renderRegions(); setView(view); };
  setView(view);
})();
</script>
</body>
</html>

[project]
name = "trend-engine"
version = "0.1.0"
description = "Cross-source trend engine: Google/Naver/YouTube/Korean realtime keywords, by country, Seoul, age & gender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.optional-dependencies]
ai = ["anthropic>=0.100"]

[project.scripts]
trend-engine = "trend_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

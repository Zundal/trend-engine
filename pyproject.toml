[project]
name = "trend-engine"
version = "0.1.0"
description = "Trend engine: what 10·20대 care about, how it spreads to older ages, and what's trending by country"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=42",
    "defusedxml>=0.7",
]

[project.scripts]
trend-engine = "trend_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
e2e = ["playwright>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: real-browser tests of the built site (run with E2E=1, needs `uv sync --group e2e` + `playwright install chromium`)"]
